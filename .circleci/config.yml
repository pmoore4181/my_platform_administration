version: 2.1

executors:
  local-machine:
    machine: true
    resource_class: peh_runner/local_laptop_runner

jobs:
  tofu-plan:
    executor: local-machine
    environment:
      TF_IN_AUTOMATION: "true"
    steps:
      - checkout
      - run: tofu version
      - run: tofu fmt -check -recursive
      - run: tofu init -input=false
      - run: tofu validate
      - run: tofu plan -input=false -out=tfplan
      - persist_to_workspace:
          root: .
          paths:
            - tfplan

  tofu-apply:
    executor: local-machine
    environment:
      TF_IN_AUTOMATION: "true"
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run: tofu init -input=false
      - run: tofu apply -input=false tfplan

workflows:
  # Pushes to main: plan only, never apply
  preview:
    jobs:
      - tofu-plan:
          context: PLATFORM_ADMIN
          filters: &on-push-main
            branches:
              only: main
            tags:
              ignore: /.*/

  # Version tags: plan, wait for a human to approve, then apply
  update:
    jobs:
      - tofu-plan:
          context: PLATFORM_ADMIN
          filters: &on-tag-main
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      - approvegithubchanges:
          type: approval
          requires:
            - tofu-plan
          filters: *on-tag-main
      - tofu-apply:
          context: PLATFORM_ADMIN
          requires:
            - approvegithubchanges
          filters: *on-tag-main